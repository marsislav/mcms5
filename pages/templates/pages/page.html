{% extends "layout.html" %}
{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<h1>{{ page.title }}</h1>
{% if not page.is_published %}<p><strong>[Draft - visible to staff only]</strong></p>{% endif %}
{% if page.banner %}<img src="{{ page.banner.url }}" alt="{{ page.title }}"/>{% endif %}
<div class="page-body">{{ page.body|safe }}</div>
{% endblock %}
